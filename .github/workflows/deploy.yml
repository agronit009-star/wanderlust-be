name: Wanderlust BE — ECR Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/wanderlust-backend:latest .
          docker push $ECR_REGISTRY/wanderlust-backend:latest

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PEM }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/wanderlust_key
          chmod 600 ~/.ssh/wanderlust_key

          ssh-keyscan -H "${{ secrets.FE_PUBLIC_IP }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H 10.0.16.162 >> ~/.ssh/known_hosts

      - name: Copy Compose to Backend EC2
        env:
          FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
        run: |
          scp \
            -i ~/.ssh/wanderlust_key \
            -o StrictHostKeyChecking=yes \
            -o ProxyJump=ubuntu@$FE_PUBLIC_IP \
            compose.yaml \
            ubuntu@10.0.16.162:~/wanderlust/backend/compose.yaml

      - name: Deploy Backend
        env:
          FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ssh \
            -i ~/.ssh/wanderlust_key \
            -o StrictHostKeyChecking=yes \
            -o ProxyJump=ubuntu@$FE_PUBLIC_IP \
            ubuntu@10.0.16.162 << EOF

            set -e

            cd ~/wanderlust/backend

            echo "Logging into ECR..."

            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            export ECR_REGISTRY=$ECR_REGISTRY

            echo "Pulling latest backend image..."
            docker compose pull

            echo "Restarting backend..."
            docker compose down
            docker compose up -d

            echo "Deployment completed."

            docker ps

          EOF

      - name: Verify Backend API
        run: |
          for i in {1..10}; do
            echo "Attempt $i..."

            if curl -sf -o /dev/null \
              -w 'HTTP Status: %{http_code}\n' \
              https://wanderlust01.duckdns.org/api/posts; then
              echo "Backend API verification successful."
              exit 0
            fi

            sleep 5
          done

          echo "Backend API verification failed."
          exit 1
